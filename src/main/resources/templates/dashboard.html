<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title><link rel="stylesheet" href="/css/style.css">
</head><body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar"><h1>Dashboard</h1><button class="logout-btn" onclick="logout()">Logout</button></div>
        <div class="content">
            <div class="stats-grid">
                <div class="stat-card"><div class="label">Products</div><div class="value" id="products">-</div></div>
                <div class="stat-card"><div class="label">Warehouses</div><div class="value" id="warehouses">-</div></div>
                <div class="stat-card"><div class="label">Total Stock</div><div class="value" id="stock">-</div></div>
                <div class="stat-card"><div class="label">Total Sales</div><div class="value" id="sales">-</div></div>
                <div class="stat-card"><div class="label">Stock Value</div><div class="value" id="stockValue">-</div></div>
                <div class="stat-card"><div class="label">Low Stock</div><div class="value" id="lowStock">-</div></div>
            </div>
            <div class="card"><div class="card-header"><h3>Low Stock Alerts</h3></div>
                <div class="card-body" id="lowStockTable"><div class="loading">Loading...</div></div>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
        async function load() {
            const [p, w, sv, ts, ls] = await Promise.all([
                apiGet('/reports/product-count'),
                apiGet('/warehouses?size=100'),
                apiGet('/reports/total-stock-value'),
                apiGet('/reports/total-sales'),
                apiGet('/reports/low-stock?threshold=10')
            ]);
            if (p) document.getElementById('products').textContent = p.totalProducts || 0;
            if (w) document.getElementById('warehouses').textContent = (w.content || []).length;
            if (sv) { document.getElementById('stock').textContent = sv.totalStockItems || 0; document.getElementById('stockValue').textContent = formatCurrency(sv.totalStockValue); }
            if (ts) document.getElementById('sales').textContent = formatCurrency(ts.totalSales);
            if (ls) {
                document.getElementById('lowStock').textContent = ls.length;
                if (ls.length) {
                    let h = '<table><tr><th>Product</th><th>Warehouse</th><th>Stock</th></tr>';
                    ls.forEach(r => h += '<tr><td>' + r.productName + '</td><td>' + r.warehouseName + '</td><td><span class="badge badge-red">' + r.currentQuantity + '</span></td></tr>');
                    document.getElementById('lowStockTable').innerHTML = h + '</table>';
                } else { document.getElementById('lowStockTable').innerHTML = '<div class="empty">All stock levels are good</div>'; }
            }
        }
        load();
    </script>
</body></html>
