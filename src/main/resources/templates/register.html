<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title><link rel="stylesheet" href="/css/style.css">
</head><body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Inventory ERP</h2>
            <p class="sub">Create your account</p>
            <div class="login-error" id="error"></div>
            <form id="regForm">
                <div class="form-group"><label>Business Name</label><input class="form-control" id="bizName" required></div>
                <div class="form-group"><label>Username</label><input class="form-control" id="username" required minlength="3"></div>
                <div class="form-group"><label>Email</label><input type="email" class="form-control" id="email" required></div>
                <div class="form-group"><label>Password</label><input type="password" class="form-control" id="password" required minlength="6"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Register</button>
            </form>
            <p style="text-align:center;margin-top:16px;font-size:12px;color:#888">Have an account? <a href="/login" style="color:#3b82f6">Sign in</a></p>
        </div>
    </div>
    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('error'); err.style.display = 'none';
            const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({businessName:document.getElementById('bizName').value, username:document.getElementById('username').value, email:document.getElementById('email').value, password:document.getElementById('password').value}) });
            const data = await res.json();
            if (data.token) { localStorage.setItem('jwt_token', data.token); window.location.href = '/dashboard'; }
            else { err.textContent = data.error || 'Failed'; err.style.display = 'block'; }
        });
    </script>
</body></html>
