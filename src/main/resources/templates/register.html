<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Inventory ERP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Inventory ERP</h2>
            <p class="subtitle">Create your account</p>
            <div class="login-error" id="error"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" class="form-control" id="businessName" required placeholder="Your business name">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" id="username" required placeholder="Choose a username" minlength="3">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Min 6 characters" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            <p style="text-align:center;margin-top:16px;font-size:13px;color:#64748b">Already have an account? <a href="/login" style="color:#3b82f6">Sign in</a></p>
        </div>
    </div>
    <script>
        if (localStorage.getItem('jwt_token')) window.location.href = '/dashboard';
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        businessName: document.getElementById('businessName').value,
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'Registration failed';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Connection failed. Try again.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
