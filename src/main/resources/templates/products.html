<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Inventory ERP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar">
            <h1>Products</h1>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openModal()">+ Add Product</button>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="content">
            <div class="card">
                <div class="card-header"><h3>All Products</h3></div>
                <div class="card-body">
                    <div class="table-container" id="productTable">
                        <div class="loading"><div class="spinner"></div>Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Add Product</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Name *</label><input type="text" class="form-control" id="name" required></div>
                <div class="form-group"><label>SKU *</label><input type="text" class="form-control" id="sku" required></div>
                <div class="form-group"><label>Price *</label><input type="number" step="0.01" class="form-control" id="price" required></div>
                <div class="form-group"><label>Brand</label><input type="text" class="form-control" id="brand"></div>
                <div class="form-group"><label>Unit</label><input type="text" class="form-control" id="unit" placeholder="e.g. pcs, kg, litre"></div>
                <div class="form-group"><label>Barcode</label><input type="text" class="form-control" id="barcode"></div>
                <div class="form-group"><label>GST %</label><input type="number" step="0.01" class="form-control" id="gstPercent"></div>
                <div class="form-group"><label>HSN Code</label><input type="text" class="form-control" id="hsnCode"></div>
                <div class="form-group"><label>Category ID</label><input type="number" class="form-control" id="categoryId"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200}
        .modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-header h3{margin:0}
        .btn-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b}
        .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    </style>

    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';

        let products = [];

        async function loadProducts() {
            showLoading('productTable');
            const data = await apiGet('/products?size=100');
            products = data ? data.content || [] : [];
            renderTable();
        }

        function renderTable() {
            if (!products.length) { showEmpty('productTable', 'No products found. Add your first product.'); return; }
            let html = '<table><thead><tr><th>Name</th><th>SKU</th><th>Price</th><th>Brand</th><th>Unit</th><th>GST%</th><th>Actions</th></tr></thead><tbody>';
            products.forEach(p => {
                html += '<tr><td>'+p.name+'</td><td>'+p.sku+'</td><td>'+formatCurrency(p.price)+'</td><td>'+(p.brand||'-')+'</td><td>'+(p.unit||'-')+'</td><td>'+(p.gstPercent!=null?p.gstPercent+'%':'-')+'</td><td><button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="editProduct('+p.id+')">Edit</button> <button class="btn btn-outline" style="font-size:11px;padding:4px 10px;color:#ef4444" onclick="deleteProduct('+p.id+')">Del</button></td></tr>';
            });
            html += '</tbody></table>';
            document.getElementById('productTable').innerHTML = html;
        }

        function openModal(product) {
            document.getElementById('modalOverlay').style.display = 'flex';
            if (product) {
                document.getElementById('modalTitle').textContent = 'Edit Product';
                document.getElementById('editId').value = product.id;
                document.getElementById('name').value = product.name || '';
                document.getElementById('sku').value = product.sku || '';
                document.getElementById('price').value = product.price || '';
                document.getElementById('brand').value = product.brand || '';
                document.getElementById('unit').value = product.unit || '';
                document.getElementById('barcode').value = product.barcode || '';
                document.getElementById('gstPercent').value = product.gstPercent != null ? product.gstPercent : '';
                document.getElementById('hsnCode').value = product.hsnCode || '';
                document.getElementById('categoryId').value = product.category ? product.category.id : '';
            } else {
                document.getElementById('modalTitle').textContent = 'Add Product';
                document.getElementById('editId').value = '';
                document.getElementById('productForm').reset();
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        async function saveProduct(e) {
            e.preventDefault();
            const body = {
                name: document.getElementById('name').value,
                sku: document.getElementById('sku').value,
                price: parseFloat(document.getElementById('price').value),
                brand: document.getElementById('brand').value || null,
                unit: document.getElementById('unit').value || null,
                barcode: document.getElementById('barcode').value || null,
                gstPercent: document.getElementById('gstPercent').value ? parseFloat(document.getElementById('gstPercent').value) : null,
                hsnCode: document.getElementById('hsnCode').value || null,
                category: document.getElementById('categoryId').value ? { id: parseInt(document.getElementById('categoryId').value) } : null
            };
            const editId = document.getElementById('editId').value;
            if (editId) {
                await apiPut('/products/' + editId, body);
            } else {
                await apiPost('/products', body);
            }
            closeModal();
            loadProducts();
        }

        function editProduct(id) {
            const p = products.find(x => x.id === id);
            if (p) openModal(p);
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            await apiDelete('/products/' + id);
            loadProducts();
        }

        loadProducts();
    </script>
</body>
</html>
