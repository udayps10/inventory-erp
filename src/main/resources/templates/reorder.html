<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reorder Suggestions - Inventory ERP</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <div th:replace="~{fragments/sidebar}"></div>

    <div class="main">
        <div class="topbar">
            <h1>Reorder Suggestions</h1>
            <div class="topbar-right">
                <select class="form-control" id="leadTimeSelect" style="width:auto">
                    <option value="3">Lead time: 3 days</option>
                    <option value="7" selected>Lead time: 7 days</option>
                    <option value="14">Lead time: 14 days</option>
                    <option value="30">Lead time: 30 days</option>
                </select>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card red">
                    <div class="label">Items to Reorder</div>
                    <div class="value" id="reorderCount">-</div>
                </div>
                <div class="stat-card orange">
                    <div class="label">Total Order Cost</div>
                    <div class="value" id="totalCost">-</div>
                </div>
                <div class="stat-card blue">
                    <div class="label">Total Qty Needed</div>
                    <div class="value" id="totalQty">-</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Reorder Cost Breakdown</h3></div>
                <div class="card-body">
                    <div class="chart-container"><canvas id="reorderChart"></canvas></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Reorder List</h3></div>
                <div class="card-body">
                    <div class="table-container" id="reorderTable">
                        <div class="loading"><div class="spinner"></div>Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';

        async function loadReorder() {
            const leadTime = document.getElementById('leadTimeSelect').value;
            const data = await apiGet('/analytics/reorder-suggestions?salesDays=30&leadTimeDays=' + leadTime);

            if (!data || !data.length) {
                showEmpty('reorderTable', 'No items need reordering');
                document.getElementById('reorderCount').textContent = '0';
                document.getElementById('totalCost').textContent = '₹0';
                document.getElementById('totalQty').textContent = '0';
                return;
            }

            const totalCost = data.reduce((s, d) => s + Number(d.estimatedCost), 0);
            const totalQty = data.reduce((s, d) => s + d.suggestedOrderQty, 0);

            document.getElementById('reorderCount').textContent = data.length;
            document.getElementById('totalCost').textContent = formatCurrency(totalCost);
            document.getElementById('totalQty').textContent = formatNumber(totalQty);

            renderChart(data.slice(0, 10));
            renderTable(data);
        }

        function renderChart(data) {
            new Chart(document.getElementById('reorderChart'), {
                type: 'bar',
                data: {
                    labels: data.map(d => d.productName),
                    datasets: [
                        {
                            label: 'Current Stock',
                            data: data.map(d => d.currentStock),
                            backgroundColor: '#3b82f6'
                        },
                        {
                            label: 'Suggested Order',
                            data: data.map(d => d.suggestedOrderQty),
                            backgroundColor: '#f97316'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { beginAtZero: true },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderTable(data) {
            let html = '<table><thead><tr><th>#</th><th>Product</th><th>SKU</th><th>Current</th><th>Avg/Day</th><th>Reorder Point</th><th>Suggest Qty</th><th>Est. Cost</th></tr></thead><tbody>';
            data.forEach((r, i) => {
                html += '<tr><td>' + (i + 1) + '</td><td>' + r.productName + '</td><td>' + r.sku + '</td><td>' + r.currentStock + '</td><td>' + r.avgDailySales + '</td><td>' + r.reorderPoint + '</td><td><strong>' + r.suggestedOrderQty + '</strong></td><td>' + formatCurrency(r.estimatedCost) + '</td></tr>';
            });
            html += '</tbody></table>';
            document.getElementById('reorderTable').innerHTML = html;
        }

        document.getElementById('leadTimeSelect').addEventListener('change', loadReorder);
        loadReorder();
    </script>
</body>
</html>
