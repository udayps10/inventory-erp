<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Inventory ERP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar">
            <h1>Customers</h1>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openModal()">+ Add Customer</button>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="content">
            <div class="card">
                <div class="card-header"><h3>All Customers</h3></div>
                <div class="card-body">
                    <div class="table-container" id="table"><div class="loading"><div class="spinner"></div>Loading...</div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header"><h3 id="modalTitle">Add Customer</h3><button class="btn-close" onclick="closeModal()">&times;</button></div>
            <form id="form" onsubmit="save(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Name *</label><input type="text" class="form-control" id="name" required></div>
                <div class="form-group"><label>Phone</label><input type="text" class="form-control" id="phone"></div>
                <div class="form-group"><label>Email</label><input type="email" class="form-control" id="email"></div>
                <div class="form-group"><label>GSTIN</label><input type="text" class="form-control" id="gstin"></div>
                <div class="form-group"><label>State</label><input type="text" class="form-control" id="state"></div>
                <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>
    <style>.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200}.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-header h3{margin:0}.btn-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}</style>
    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
        let items = [];
        async function load() { showLoading('table'); const d = await apiGet('/customers?size=100'); items = d ? d.content || [] : []; render(); }
        function render() {
            if (!items.length) { showEmpty('table', 'No customers found.'); return; }
            let h = '<table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>GSTIN</th><th>State</th><th>Actions</th></tr></thead><tbody>';
            items.forEach(i => { h += '<tr><td>'+i.name+'</td><td>'+(i.phone||'-')+'</td><td>'+(i.email||'-')+'</td><td>'+(i.gstin||'-')+'</td><td>'+(i.state||'-')+'</td><td><button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="edit('+i.id+')">Edit</button> <button class="btn btn-outline" style="font-size:11px;padding:4px 10px;color:#ef4444" onclick="del('+i.id+')">Del</button></td></tr>'; });
            h += '</tbody></table>'; document.getElementById('table').innerHTML = h;
        }
        function openModal(item) {
            document.getElementById('modalOverlay').style.display = 'flex';
            if (item) { document.getElementById('modalTitle').textContent = 'Edit Customer'; document.getElementById('editId').value = item.id; document.getElementById('name').value = item.name||''; document.getElementById('phone').value = item.phone||''; document.getElementById('email').value = item.email||''; document.getElementById('gstin').value = item.gstin||''; document.getElementById('state').value = item.state||''; }
            else { document.getElementById('modalTitle').textContent = 'Add Customer'; document.getElementById('editId').value = ''; document.getElementById('form').reset(); }
        }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        async function save(e) {
            e.preventDefault();
            const body = { name: document.getElementById('name').value, phone: document.getElementById('phone').value||null, email: document.getElementById('email').value||null, gstin: document.getElementById('gstin').value||null, state: document.getElementById('state').value||null };
            const id = document.getElementById('editId').value;
            if (id) { await apiPut('/customers/'+id, body); }
            else { await apiPost('/customers', body); }
            closeModal(); load();
        }
        function edit(id) { const i = items.find(x => x.id === id); if (i) openModal(i); }
        async function del(id) { if (!confirm('Delete?')) return; await apiDelete('/customers/'+id); load(); }
        load();
    </script>
</body>
</html>
