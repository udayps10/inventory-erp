<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouses</title><link rel="stylesheet" href="/css/style.css">
</head><body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar"><h1>Warehouses</h1><div><button class="btn btn-primary" onclick="openModal()">+ Add</button> <button class="logout-btn" onclick="logout()">Logout</button></div></div>
        <div class="content">
            <div class="card"><div class="card-body" id="table"><div class="loading">Loading...</div></div></div>
        </div>
    </div>
    <div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <h3 id="modalTitle">Add Warehouse</h3>
            <form id="form" onsubmit="save(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Name *</label><input class="form-control" id="name" required></div>
                <div class="form-group"><label>Location</label><input class="form-control" id="location"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
        let items = [];
        async function load() {
            const d = await apiGet('/warehouses?size=100');
            items = d ? d.content || [] : [];
            if (!items.length) { document.getElementById('table').innerHTML = '<div class="empty">No warehouses yet</div>'; return; }
            let h = '<table><tr><th>Name</th><th>Location</th><th>Actions</th></tr>';
            items.forEach(i => h += '<tr><td>' + i.name + '</td><td>' + (i.location||'-') + '</td><td><button class="btn btn-outline" onclick="edit(' + i.id + ')" style="margin-right:4px">Edit</button><button class="btn btn-danger" onclick="del(' + i.id + ')">Del</button></td></tr>');
            document.getElementById('table').innerHTML = h + '</table>';
        }
        function openModal(item) {
            document.getElementById('modal').style.display = 'flex';
            if (item) { document.getElementById('modalTitle').textContent = 'Edit Warehouse'; document.getElementById('editId').value = item.id; document.getElementById('name').value = item.name||''; document.getElementById('location').value = item.location||''; }
            else { document.getElementById('modalTitle').textContent = 'Add Warehouse'; document.getElementById('editId').value = ''; document.getElementById('form').reset(); }
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        async function save(e) {
            e.preventDefault();
            const body = { name: document.getElementById('name').value, location: document.getElementById('location').value||null };
            const id = document.getElementById('editId').value;
            if (id) await apiPut('/warehouses/' + id, body);
            else await apiPost('/warehouses', body);
            closeModal(); load();
        }
        function edit(id) { const i = items.find(x => x.id === id); if (i) openModal(i); }
        async function del(id) { if (!confirm('Delete?')) return; await apiDelete('/warehouses/' + id); load(); }
        load();
    </script>
</body></html>
