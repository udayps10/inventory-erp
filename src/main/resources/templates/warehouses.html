<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouses - Inventory ERP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar">
            <h1>Warehouses</h1>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openModal()">+ Add Warehouse</button>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="content">
            <div class="card">
                <div class="card-header"><h3>All Warehouses</h3></div>
                <div class="card-body">
                    <div class="table-container" id="table"><div class="loading"><div class="spinner"></div>Loading...</div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header"><h3 id="modalTitle">Add Warehouse</h3><button class="btn-close" onclick="closeModal()">&times;</button></div>
            <form id="form" onsubmit="save(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Name *</label><input type="text" class="form-control" id="name" required></div>
                <div class="form-group"><label>Location</label><input type="text" class="form-control" id="location"></div>
                <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>
    <style>.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200}.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-header h3{margin:0}.btn-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}</style>
    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
        let items = [];
        async function load() { const d = await apiGet('/warehouses?size=100'); items = d ? d.content || [] : []; render(); }
        function render() {
            if (!items.length) { showEmpty('table', 'No warehouses found.'); return; }
            let h = '<table><thead><tr><th>Name</th><th>Location</th><th>Actions</th></tr></thead><tbody>';
            items.forEach(i => { h += '<tr><td>'+i.name+'</td><td>'+(i.location||'-')+'</td><td><button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="edit('+i.id+')">Edit</button> <button class="btn btn-outline" style="font-size:11px;padding:4px 10px;color:#ef4444" onclick="del('+i.id+')">Delete</button></td></tr>'; });
            h += '</tbody></table>'; document.getElementById('table').innerHTML = h;
        }
        function openModal(item) {
            document.getElementById('modal').style.display = 'flex';
            if (item) { document.getElementById('modalTitle').textContent = 'Edit Warehouse'; document.getElementById('editId').value = item.id; document.getElementById('name').value = item.name||''; document.getElementById('location').value = item.location||''; }
            else { document.getElementById('modalTitle').textContent = 'Add Warehouse'; document.getElementById('editId').value = ''; document.getElementById('form').reset(); }
        }
        function closeModal(e) { if (e && e.target !== document.getElementById('modal')) return; document.getElementById('modal').style.display = 'none'; }
        async function save(e) {
            e.preventDefault();
            const body = { name: document.getElementById('name').value, location: document.getElementById('location').value||null };
            const id = document.getElementById('editId').value;
            if (id) { await fetch('/api/warehouses/'+id, { method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()}, body:JSON.stringify(body) }); }
            else { await apiPost('/warehouses', body); }
            closeModal(); load();
        }
        function edit(id) { const i = items.find(x => x.id === id); if (i) openModal(i); }
        async function del(id) { if (!confirm('Delete?')) return; await fetch('/api/warehouses/'+id, { method:'DELETE', headers:{'Authorization':'Bearer '+getToken()} }); load(); }
        load();
    </script>
</body>
</html>
