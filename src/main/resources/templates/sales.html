<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales</title><link rel="stylesheet" href="/css/style.css">
</head><body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar"><h1>Sales</h1><div><button class="btn btn-primary" onclick="openModal()">+ New Sale</button> <button class="logout-btn" onclick="logout()">Logout</button></div></div>
        <div class="content">
            <div class="card"><div class="card-body" id="table"><div class="loading">Loading...</div></div></div>
        </div>
    </div>
    <div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <h3>New Sale</h3>
            <form id="form" onsubmit="save(event)">
                <div class="form-group"><label>Product</label><select class="form-control" id="productId" required><option value="">Select product...</option></select></div>
                <div class="form-row">
                    <div class="form-group"><label>Quantity</label><input type="number" class="form-control" id="quantity" required min="1"></div>
                    <div class="form-group"><label>Price</label><input type="number" step="0.01" class="form-control" id="price" required></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
        let products = [];

        async function load() {
            const d = await apiGet('/products?size=100');
            products = d ? d.content || [] : [];
            const s = await apiGet('/sales?size=50');
            const items = s ? s.content || [] : [];
            if (!items.length) { document.getElementById('table').innerHTML = '<div class="empty">No sales yet</div>'; return; }
            let h = '<table><tr><th>Date</th><th>Product</th><th>Qty</th><th>Price</th></tr>';
            items.forEach(i => h += '<tr><td>' + (i.saleDate ? i.saleDate.substring(0,10) : '-') + '</td><td>' + (i.product ? i.product.name : '-') + '</td><td>' + i.quantity + '</td><td>' + formatCurrency(i.price) + '</td></tr>');
            document.getElementById('table').innerHTML = h + '</table>';
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('form').reset();
            const pSel = document.getElementById('productId');
            pSel.innerHTML = '<option value="">Select product...</option>';
            products.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name + ' (' + formatCurrency(p.price) + ')'; pSel.appendChild(o); });
            pSel.onchange = function() { const p = products.find(x => x.id == this.value); if (p) document.getElementById('price').value = p.price; };
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function save(e) {
            e.preventDefault();
            await apiPost('/sales', {
                productId: +document.getElementById('productId').value,
                quantity: +document.getElementById('quantity').value,
                price: parseFloat(document.getElementById('price').value)
            });
            closeModal(); load();
        }
        load();
    </script>
</body></html>
