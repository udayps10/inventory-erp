<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title><link rel="stylesheet" href="/css/style.css">
</head><body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Inventory ERP</h2>
            <p class="sub">Sign in to your account</p>
            <div class="login-error" id="error"></div>
            <form id="loginForm">
                <div class="form-group"><label>Username</label><input class="form-control" id="username" required></div>
                <div class="form-group"><label>Password</label><input type="password" class="form-control" id="password" required></div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Sign In</button>
            </form>
            <p style="text-align:center;margin-top:16px;font-size:12px;color:#888">No account? <a href="/register" style="color:#3b82f6">Register</a></p>
        </div>
    </div>
    <script>
        if (localStorage.getItem('jwt_token')) window.location.href = '/dashboard';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('error'); err.style.display = 'none';
            const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:document.getElementById('username').value, password:document.getElementById('password').value}) });
            const data = await res.json();
            if (data.token) { localStorage.setItem('jwt_token', data.token); window.location.href = '/dashboard'; }
            else { err.textContent = data.error || 'Login failed'; err.style.display = 'block'; }
        });
    </script>
</body></html>
