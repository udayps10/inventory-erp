<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .card h2 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #1a1a2e; }
        .card .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-control:focus { outline: none; border-color: #3b82f6; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .error { background: #fee; color: #c00; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
        .links { text-align: center; margin-top: 20px; font-size: 13px; color: #888; }
        .links a { color: #3b82f6; text-decoration: none; }
    </style>
</head><body>
    <div class="card">
        <h2>Inventory ERP</h2>
        <p class="sub">Sign in to your account</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <div class="form-group"><label>Username</label><input class="form-control" id="username" required placeholder="Enter username"></div>
            <div class="form-group"><label>Password</label><input type="password" class="form-control" id="password" required placeholder="Enter password"></div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <div class="links">Don't have an account? <a href="/register">Register</a></div>
    </div>
    <script>
        if (localStorage.getItem('jwt_token')) window.location.href = '/dashboard';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('error'); err.style.display = 'none';
            const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:document.getElementById('username').value, password:document.getElementById('password').value}) });
            const data = await res.json();
            if (data.token) { localStorage.setItem('jwt_token', data.token); window.location.href = '/dashboard'; }
            else { err.textContent = data.error || 'Login failed'; err.style.display = 'block'; }
        });
    </script>
</body></html>
