<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory ERP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Inventory ERP</h2>
            <p class="subtitle">Sign in to your account</p>
            <div class="login-error" id="error"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" id="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
            <p style="text-align:center;margin-top:16px;font-size:13px;color:#64748b">Don't have an account? <a href="/register" style="color:#3b82f6">Register</a></p>
        </div>
    </div>
    <script>
        if (localStorage.getItem('jwt_token')) {
            window.location.href = '/dashboard';
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.message || 'Invalid credentials';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Connection failed. Try again.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
