<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchases - Inventory ERP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar">
            <h1>Purchases</h1>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openModal()">+ New Purchase</button>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="content">
            <div class="card">
                <div class="card-header"><h3>Purchase History</h3></div>
                <div class="card-body">
                    <div class="table-container" id="table"><div class="loading"><div class="spinner"></div>Loading...</div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header"><h3>New Purchase</h3><button class="btn-close" onclick="closeModal()">&times;</button></div>
            <form id="form" onsubmit="save(event)">
                <div class="form-group"><label>Supplier ID *</label><input type="number" class="form-control" id="supplierId" required></div>
                <div class="form-group"><label>Product ID *</label><input type="number" class="form-control" id="productId" required></div>
                <div class="form-group"><label>Warehouse ID *</label><input type="number" class="form-control" id="warehouseId" required></div>
                <div class="form-group"><label>Quantity *</label><input type="number" class="form-control" id="quantity" required min="1"></div>
                <div class="form-group"><label>Price *</label><input type="number" step="0.01" class="form-control" id="price" required></div>
                <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>
    <style>.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200}.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-header h3{margin:0}.btn-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}</style>
    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
        let items = [];
        async function load() { const d = await apiGet('/purchases?size=50'); items = d ? d.content || [] : []; render(); }
        function render() {
            if (!items.length) { showEmpty('table', 'No purchases found.'); return; }
            let h = '<table><thead><tr><th>ID</th><th>Product</th><th>Supplier</th><th>Qty</th><th>Price</th><th>Date</th></tr></thead><tbody>';
            items.forEach(i => { h += '<tr><td>'+i.id+'</td><td>'+(i.product?i.product.name:'-')+'</td><td>'+(i.supplier?i.supplier.name:'-')+'</td><td>'+i.quantity+'</td><td>'+formatCurrency(i.price)+'</td><td>'+formatDate(i.purchaseDate)+'</td></tr>'; });
            h += '</tbody></table>'; document.getElementById('table').innerHTML = h;
        }
        function openModal() { document.getElementById('modal').style.display = 'flex'; document.getElementById('form').reset(); }
        function closeModal(e) { if (e && e.target !== document.getElementById('modal')) return; document.getElementById('modal').style.display = 'none'; }
        async function save(e) {
            e.preventDefault();
            const body = { supplierId: parseInt(document.getElementById('supplierId').value), productId: parseInt(document.getElementById('productId').value), warehouseId: parseInt(document.getElementById('warehouseId').value), quantity: parseInt(document.getElementById('quantity').value), price: parseFloat(document.getElementById('price').value) };
            await apiPost('/purchases', body);
            closeModal(); load();
        }
        load();
    </script>
</body>
</html>
