<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock</title><link rel="stylesheet" href="/css/style.css">
</head><body>
    <div th:replace="~{fragments/sidebar}"></div>
    <div class="main">
        <div class="topbar"><h1>Stock Levels</h1><div><button class="btn btn-primary" onclick="openModal()">+ Update Stock</button> <button class="logout-btn" onclick="logout()">Logout</button></div></div>
        <div class="content">
            <div class="card"><div class="card-body" id="table"><div class="loading">Loading...</div></div></div>
        </div>
    </div>
    <div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <h3>Update Stock</h3>
            <form id="form" onsubmit="save(event)">
                <div class="form-group"><label>Product</label><select class="form-control" id="productId" required><option value="">Select product...</option></select></div>
                <div class="form-row">
                    <div class="form-group"><label>Quantity (+/-)</label><input type="number" class="form-control" id="qty" required></div>
                    <div class="form-group"><label>Reason</label><select class="form-control" id="reason"><option>PURCHASE</option><option>ADJUSTMENT</option></select></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
        let products = [];

        async function load() {
            const [p, d] = await Promise.all([apiGet('/products?size=100'), apiGet('/inventory?size=100')]);
            products = p ? p.content || [] : [];
            const items = d ? d.content || [] : [];
            if (!items.length) { document.getElementById('table').innerHTML = '<div class="empty">No stock records. Add products first.</div>'; return; }
            let h = '<table><tr><th>Product</th><th>Quantity</th><th>Status</th></tr>';
            items.forEach(i => {
                const q = i.quantity;
                const badge = q === 0 ? '<span class="badge badge-red">Out of Stock</span>' : q < 10 ? '<span class="badge badge-orange">Low</span>' : '<span class="badge badge-green">OK</span>';
                h += '<tr><td>' + (i.product ? i.product.name : '-') + '</td><td>' + q + '</td><td>' + badge + '</td></tr>';
            });
            document.getElementById('table').innerHTML = h + '</table>';
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('form').reset();
            const pSel = document.getElementById('productId');
            pSel.innerHTML = '<option value="">Select product...</option>';
            products.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; pSel.appendChild(o); });
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function save(e) {
            e.preventDefault();
            await apiPost('/stock-movements', {
                productId: +document.getElementById('productId').value,
                quantityChange: +document.getElementById('qty').value,
                reason: document.getElementById('reason').value
            });
            closeModal(); load();
        }
        load();
    </script>
</body></html>
